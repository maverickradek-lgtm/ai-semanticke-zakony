name: DEBUG - format citace Cl. uzlu (jednorazove)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: [self-hosted, nas]
    timeout-minutes: 30
    steps:
      - name: Cekat na DNS/sit (NAS runner muze mit vypadek)
        run: |
          for i in $(seq 1 30); do
            getent hosts github.com >/dev/null 2>&1 && echo "DNS OK" && break
            echo "DNS zatim nedostupne, cekam 10s... ($i/30)"
            sleep 10
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --root-user-action=ignore -r scripts/requirements.txt

      - name: Diagnostika citace
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/debug_esbirka_citace.py
