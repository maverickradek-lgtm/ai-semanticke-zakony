name: Overeni a uklid zakonu (smaze ze Supabase, co je bezpecne hotove v Neonu)

on:
  workflow_dispatch:
    inputs:
      max_delete_per_run:
        description: "Max. pocet dokumentu smazanych za jeden beh"
        required: false
        default: "500"
  schedule:
    - cron: '15 6 * * *'

jobs:
  verify-cleanup:
    runs-on: [self-hosted, nas]
    timeout-minutes: 20
    steps:
      - name: Cekat na DNS/sit (NAS runner muze mit vypadek)
        run: |
          for i in $(seq 1 30); do
            getent hosts github.com >/dev/null 2>&1 && echo "DNS OK" && break
            echo "DNS zatim nedostupne, cekam 10s... ($i/30)"
            sleep 10
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --root-user-action=ignore -r scripts/requirements.txt

      - name: Overeni + bezpecny uklid
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEON_ZAKONY_DO1997_DB_URL: ${{ secrets.NEON_ZAKONY_DO1997_DB_URL }}
          NEON_ZAKONY_1998_2007_DB_URL: ${{ secrets.NEON_ZAKONY_1998_2007_DB_URL }}
          NEON_ZAKONY_2008_2020_DB_URL: ${{ secrets.NEON_ZAKONY_2008_2020_DB_URL }}
          NEON_ZAKONY_2021_DOSUD_DB_URL: ${{ secrets.NEON_ZAKONY_2021_DOSUD_DB_URL }}
          MAX_DELETE_PER_RUN: ${{ github.event.inputs.max_delete_per_run || '500' }}
        run: python scripts/verify_and_cleanup_zakony_supabase.py
