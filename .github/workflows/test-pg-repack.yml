name: TEST pg_repack (throwaway table only)

on:
  workflow_dispatch: {}

jobs:
  test-repack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install psql client (PGDG repo)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/pgdg.asc
          sudo gpg --batch --yes --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg /tmp/pgdg.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17 build-essential libpq-dev postgresql-server-dev-17 zlib1g-dev libzstd-dev liblz4-dev

      - name: Build pg_repack 1.5.2 client from source (to match DB extension version exactly)
        run: |
          git clone --branch ver_1.5.2 --depth 1 https://github.com/reorg/pg_repack.git
          cd pg_repack
          make
          sudo make install
          /usr/lib/postgresql/17/bin/pg_repack --version

      - name: Show sizes BEFORE repack
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$PGURL" -c "select pg_size_pretty(pg_total_relation_size('repack_test')) as size_before;"
          psql "$PGURL" -c "select * from pgstattuple('repack_test');"

      - name: Run pg_repack on repack_test ONLY (throwaway test table, not production data)
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/pg_repack -d "$PGURL" -t public.repack_test --no-superuser-check -j 2 --echo

      - name: Show sizes AFTER repack
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$PGURL" -c "select pg_size_pretty(pg_total_relation_size('repack_test')) as size_after;"
          psql "$PGURL" -c "select * from pgstattuple('repack_test');"
