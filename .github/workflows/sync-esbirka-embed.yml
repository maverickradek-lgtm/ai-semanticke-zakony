name: Sync e-Sbirka - denni dobihani embeddingu (faze B)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * *"

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run embedding backfill (hlavni klic)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_USER_ID: "2648f5db-bea6-4cac-b490-ad0ec59723df"
          DAILY_EMBED_BUDGET: "2500"
        run: python scripts/sync_esbirka_embed.py

  embed_secondary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run embedding backfill (druhy, samostatny Gemini klic)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY_OVERRIDE: ${{ secrets.GEMINI_API_KEY_2 }}
          DAILY_EMBED_BUDGET: "2500"
          REVERSE_ORDER: "true"
        run: python scripts/sync_esbirka_embed.py

  embed_uohs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run embedding backfill (vyhrazeny klic pro rozhodnuti UOHS)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY_OVERRIDE: ${{ secrets.GEMINI_API_KEY_UOHS }}
          DOC_TYPE_FILTER: "rozhodnuti_uohs"
          DAILY_EMBED_BUDGET: "2500"
          EMBED_PAGE_SIZE: "150"
        run: python scripts/sync_esbirka_embed.py
