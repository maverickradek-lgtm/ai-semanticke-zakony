name: Sync Sbirka NS (judikatura)

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: "Kolik novych rozhodnuti zpracovat v tomto behu"
        required: false
        default: "80"
      cutoff_year:
        description: "Od ktereho roku importovat (vcetne)"
        required: false
        default: "2019"
  schedule:
    - cron: "30 2 * * *"

concurrency:
  group: db-heavy-secondary
  cancel-in-progress: false

jobs:
  sync_sbirka_ns:
    runs-on: [self-hosted, nas]
    timeout-minutes: 60
    steps:
      - name: Cekat na DNS/sit (NAS runner muze mit vypadek)
        run: |
          for i in $(seq 1 30); do
            getent hosts github.com >/dev/null 2>&1 && echo "DNS OK" && break
            echo "DNS zatim nedostupne, cekam 10s... ($i/30)"
            sleep 10
          done

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --root-user-action=ignore -r scripts/requirements.txt
      - name: Sync Sbirka NS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_NS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_NS }}
          MAX_ITEMS: ${{ github.event.inputs.max_items || '80' }}
          CUTOFF_YEAR: ${{ github.event.inputs.cutoff_year || '2019' }}
        run: python scripts/sync_sbirka_ns.py
