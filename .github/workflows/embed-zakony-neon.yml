name: Embedding zakonu ve 4 Neon shardech

on:
  workflow_dispatch:
    inputs:
      batch_per_shard:
        description: "Kolik chunku max. na jeden shard v jedne davce"
        required: false
        default: "20"
  schedule:
    - cron: "0 */2 * * *"

concurrency:
  group: embed-zakony-neon-solo
  cancel-in-progress: false

jobs:
  embed:
    runs-on: [self-hosted, nas]
    timeout-minutes: 55
    steps:
      - name: Cekat na DNS/sit (NAS runner muze mit vypadek)
        run: |
          for i in $(seq 1 30); do
            getent hosts github.com >/dev/null 2>&1 && echo "DNS OK" && break
            echo "DNS zatim nedostupne, cekam 10s... ($i/30)"
            sleep 10
          done

      - name: DOCASNA diagnostika site (DNS/HTTPS pripojeni)
        run: |
          echo "=== /etc/resolv.conf ==="
          cat /etc/resolv.conf || true
          echo ""
          echo "=== 30x getent hosts generativelanguage.googleapis.com (1x/2s) ==="
          ok=0; fail=0
          for i in $(seq 1 30); do
            if getent hosts generativelanguage.googleapis.com >/dev/null 2>&1; then
              ok=$((ok+1))
            else
              fail=$((fail+1))
              echo "  FAIL pokus $i v $(date -u +%H:%M:%S)"
            fi
            sleep 2
          done
          echo "DNS vysledek: OK=$ok FAIL=$fail"
          echo ""
          echo "=== 10x curl na generativelanguage.googleapis.com (1x/1s) ==="
          for i in $(seq 1 10); do
            curl -sS -o /dev/null -m 5 -w "pokus $i: http=%{http_code} celkovy_cas=%{time_total}s dns_cas=%{time_namelookup}s\n" https://generativelanguage.googleapis.com/ || echo "  curl selhal (pokus $i)"
            sleep 1
          done
          echo ""
          echo "=== 10x curl na dmnenjykqhxkipxulhxr.supabase.co ==="
          for i in $(seq 1 10); do
            curl -sS -o /dev/null -m 5 -w "pokus $i: http=%{http_code} celkovy_cas=%{time_total}s dns_cas=%{time_namelookup}s\n" https://dmnenjykqhxkipxulhxr.supabase.co/ || echo "  curl selhal (pokus $i)"
            sleep 1
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --root-user-action=ignore -r scripts/requirements.txt

      - name: Embed pending chunky (4 shardy)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEON_ZAKONY_DO1997_DB_URL: ${{ secrets.NEON_ZAKONY_DO1997_DB_URL }}
          NEON_ZAKONY_1998_2007_DB_URL: ${{ secrets.NEON_ZAKONY_1998_2007_DB_URL }}
          NEON_ZAKONY_2008_2020_DB_URL: ${{ secrets.NEON_ZAKONY_2008_2020_DB_URL }}
          NEON_ZAKONY_2021_DOSUD_DB_URL: ${{ secrets.NEON_ZAKONY_2021_DOSUD_DB_URL }}
          BATCH_PER_SHARD: ${{ github.event.inputs.batch_per_shard || '20' }}
          GEMINI_API_KEY_POOL: "${{ secrets.GEMINI_API_KEY_3 }},${{ secrets.GEMINI_API_KEY_UOHS }},${{ secrets.GEMINI_API_KEY_NS }},${{ secrets.GEMINI_API_KEY_2 }}"
          GEMINI_API_KEY_POOL_LABELS: "GEMINI_API_KEY_3,GEMINI_API_KEY_UOHS,GEMINI_API_KEY_NS,GEMINI_API_KEY_2"
          GEMINI_API_KEY_BACKUP: "${{ secrets.GEMINI_API_KEY_4 }}"
          GEMINI_API_KEY_BACKUP_LABEL: "GEMINI_API_KEY_4"
          GEMINI_KEY_QUOTA_CAPS: '{"GEMINI_API_KEY_4": 0.6}'
          TIME_BUDGET_SECONDS: "3000"
        run: python scripts/embed_zakony_neon.py
