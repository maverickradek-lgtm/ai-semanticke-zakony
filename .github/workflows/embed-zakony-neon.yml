name: Embedding zakonu ve 4 Neon shardech

on:
  workflow_dispatch:
    inputs:
      batch_per_shard:
        description: "Kolik chunku max. na jeden shard v jedne davce"
        required: false
        default: "20"
  schedule:
    # Radek 2026-09-29: znovu zapnuto - reshardovani (01-06) uz bezi
    # automaticky a overene se sam zastavuje, takze embeddovani novych
    # (cistych) reshard shardu muze bezet soubezne.
    - cron: "0 */2 * * *"

concurrency:
  group: embed-zakony-neon-solo
  cancel-in-progress: false

jobs:
  embed:
    runs-on: [self-hosted, nas]
    timeout-minutes: 55
    steps:
      - name: Cekat na DNS/sit (NAS runner muze mit vypadek)
        run: |
          for i in $(seq 1 30); do
            getent hosts github.com >/dev/null 2>&1 && echo "DNS OK" && break
            echo "DNS zatim nedostupne, cekam 10s... ($i/30)"
            sleep 10
          done

      - name: Predbezna kontrola kvot Gemini klicu (kdyz jsou vsechny vycerpane, beh se ukonci)
        id: quota
        env:
          GEMINI_KEYS: "${{ secrets.GEMINI_API_KEY_3 }},${{ secrets.GEMINI_API_KEY_UOHS }},${{ secrets.GEMINI_API_KEY_NS }},${{ secrets.GEMINI_API_KEY_2 }},${{ secrets.GEMINI_API_KEY_4 }}"
        run: |
          # Radek 2026-10-23: jedno lehke volani na kazdy klic. Kdyz VSECHNY vraci 429
          # (vycerpana kvota), zbytek behu se preskoci - setrime cas NAS runneru.
          # Chyba site/jiny kod nez 429 = klic povazujeme za pouzitelny (beh pokracuje).
          probe_all() {
            usable=0
            for k in $(echo "$GEMINI_KEYS" | tr ',' ' '); do
              [ -z "$k" ] && continue
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 -X POST \
                -H "Content-Type: application/json" -H "x-goog-api-key: $k" \
                -d '{"content":{"parts":[{"text":"test"}]},"outputDimensionality":256}' \
                "https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent" || echo 000)
              echo "  klic: HTTP $code"
              if [ "$code" != "429" ]; then usable=$((usable+1)); fi
            done
          }
          probe_all
          if [ "$usable" -eq 0 ]; then
            echo "Vsechny klice vraci 429 - zkousim znovu za 30 s (mozna jen minutovy limit)..."
            sleep 30
            probe_all
          fi
          if [ "$usable" -eq 0 ]; then
            echo "Kvoty vsech Gemini klicu jsou vycerpane - beh koncim, nic se neembeduje."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pouzitelnych klicu: $usable - pokracuji."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.quota.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.quota.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.quota.outputs.skip != 'true'
        run: pip install --root-user-action=ignore -r scripts/requirements.txt

      - name: Embed pending chunky (4 shardy)
        if: steps.quota.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEON_ZAKONY_DO1997_DB_URL: ${{ secrets.NEON_ZAKONY_DO1997_DB_URL }}
          NEON_ZAKONY_1998_2007_DB_URL: ${{ secrets.NEON_ZAKONY_1998_2007_DB_URL }}
          NEON_ZAKONY_2008_2020_DB_URL: ${{ secrets.NEON_ZAKONY_2008_2020_DB_URL }}
          NEON_ZAKONY_2021_DOSUD_DB_URL: ${{ secrets.NEON_ZAKONY_2021_DOSUD_DB_URL }}
          NEON_RESHARD_01_DB_URL: ${{ secrets.NEON_RESHARD_01_DB_URL }}
          NEON_RESHARD_02_DB_URL: ${{ secrets.NEON_RESHARD_02_DB_URL }}
          NEON_RESHARD_03_DB_URL: ${{ secrets.NEON_RESHARD_03_DB_URL }}
          NEON_RESHARD_04_DB_URL: ${{ secrets.NEON_RESHARD_04_DB_URL }}
          NEON_RESHARD_05_DB_URL: ${{ secrets.NEON_RESHARD_05_DB_URL }}
          NEON_RESHARD_06_DB_URL: ${{ secrets.NEON_RESHARD_06_DB_URL }}
          NEON_RESHARD_07_DB_URL: ${{ secrets.NEON_RESHARD_07_DB_URL }}
          NEON_RESHARD_08_DB_URL: ${{ secrets.NEON_RESHARD_08_DB_URL }}
          NEON_RESHARD_09_DB_URL: ${{ secrets.NEON_RESHARD_09_DB_URL }}
          BATCH_PER_SHARD: ${{ github.event.inputs.batch_per_shard || '20' }}
          GEMINI_API_KEY_POOL: "${{ secrets.GEMINI_API_KEY_3 }},${{ secrets.GEMINI_API_KEY_UOHS }},${{ secrets.GEMINI_API_KEY_NS }},${{ secrets.GEMINI_API_KEY_2 }}"
          GEMINI_API_KEY_POOL_LABELS: "GEMINI_API_KEY_3,GEMINI_API_KEY_UOHS,GEMINI_API_KEY_NS,GEMINI_API_KEY_2"
          GEMINI_API_KEY_BACKUP: "${{ secrets.GEMINI_API_KEY_4 }}"
          GEMINI_API_KEY_BACKUP_LABEL: "GEMINI_API_KEY_4"
          GEMINI_KEY_QUOTA_CAPS: '{"GEMINI_API_KEY_4": 0.6}'
          TIME_BUDGET_SECONDS: "3000"
        run: python scripts/embed_zakony_neon.py
