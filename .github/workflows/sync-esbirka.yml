name: Sync e-Sbirka (test - rucni spusteni)

on:
  workflow_dispatch: {}
  # az overime spravnost vysledku, prepneme na denni harmonogram, napr.:
  # schedule:
  #   - cron: "0 3 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_USER_ID: "2648f5db-bea6-4cac-b490-ad0ec59723df"
          MAX_CHUNKS_PER_ACT: "15"
        run: python scripts/sync_esbirka.py
