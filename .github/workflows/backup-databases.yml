name: Backup databazi na Google Disk

# Jednou za ~14 dni (1. a 15. den v mesici, cron nema presne "kazdych 14 dni")
# zaloha vsech pripojenych databazi (Supabase + Neon) na Google Disk.
# Drzi posledni 4 behy (cca 2 mesice zpetne), starsi automaticky maze skript.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1,15 * *"

jobs:
  backup:
    runs-on: [self-hosted, nas]
    timeout-minutes: 90
    steps:
      - name: Cekat na DNS/sit (NAS runner muze mit vypadek)
        run: |
          for i in $(seq 1 30); do
            getent hosts github.com >/dev/null 2>&1 && echo "DNS OK" && break
            echo "DNS zatim nedostupne, cekam 10s... ($i/30)"
            sleep 10
          done

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y postgresql-client
          pip install google-api-python-client google-auth

      - name: Run backup
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          SUPABASE_MAIN_DB_URL: ${{ secrets.SUPABASE_MAIN_DB_URL }}
          SUPABASE_JUDIKATURA_DB_URL: ${{ secrets.SUPABASE_JUDIKATURA_DB_URL }}
          NEON_ZAKONY_DO1997_DB_URL: ${{ secrets.NEON_ZAKONY_DO1997_DB_URL }}
          NEON_ZAKONY_1998_2007_DB_URL: ${{ secrets.NEON_ZAKONY_1998_2007_DB_URL }}
          NEON_ZAKONY_2008_2020_DB_URL: ${{ secrets.NEON_ZAKONY_2008_2020_DB_URL }}
          NEON_ZAKONY_2021_DOSUD_DB_URL: ${{ secrets.NEON_ZAKONY_2021_DOSUD_DB_URL }}
          NEON_CELNI_DB_URL: ${{ secrets.NEON_CELNI_DB_URL }}
          NEON_ERU_DB_URL: ${{ secrets.NEON_ERU_DB_URL }}
          NEON_FS_DB_URL: ${{ secrets.NEON_FS_DB_URL }}
          NEON_MF_DB_URL: ${{ secrets.NEON_MF_DB_URL }}
          NEON_MMR_DB_URL: ${{ secrets.NEON_MMR_DB_URL }}
          NEON_MV_DB_URL: ${{ secrets.NEON_MV_DB_URL }}
          NEON_UOHS_DB_URL: ${{ secrets.NEON_UOHS_DB_URL }}
          NEON_UOOU_DB_URL: ${{ secrets.NEON_UOOU_DB_URL }}
          NEON_US_DB_URL: ${{ secrets.NEON_US_DB_URL }}
          NEON_IFRS_DB_URL: ${{ secrets.NEON_IFRS_DB_URL }}
        run: python scripts/backup_to_gdrive.py
