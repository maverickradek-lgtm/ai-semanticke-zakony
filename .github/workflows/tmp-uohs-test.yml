name: TMP test dostupnosti UOHS z GitHub serveru (smazat po pouziti)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Zkusit stahnout stranky ÚOHS
        run: |
          for u in \
            "https://uohs.gov.cz/cs/verejne-zakazky/soudni-prezkum-rozhodnuti.html" \
            "https://www.uohs.cz/download/sbirky_rozhodnuti/rozsudky_VZ/6As138_2017_27.pdf" \
            "https://www.uohs.cz/" ; do
            code=$(curl -s -o /tmp/out.bin -w "%{http_code} %{size_download}B %{time_total}s" --max-time 40 -A "Mozilla/5.0 (compatible; AIsemantickeZakony/1.0)" "$u" || echo "chyba")
            echo "$u -> $code"
          done
