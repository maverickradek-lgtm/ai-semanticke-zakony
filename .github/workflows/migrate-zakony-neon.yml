          NEON_RESHARD_06_DB_URL: ${{ secrets.NEON_RESHARD_06_DB_URL }}
          NEON_RESHARD_07_DB_URL: ${{ secrets.NEON_RESHARD_07_DB_URL }}
          NEON_RESHARD_08_DB_URL: ${{ secrets.NEON_RESHARD_08_DB_URL }}
          NEON_RESHARD_09_DB_URL: ${{ secrets.NEON_RESHARD_09_DB_URL }}
          TIME_BUDGET_SECONDS: "3000"
        run: python scripts/migrate_zakony_to_reshard.py
name: Migrace zakonu do Neon shardu (kopie, bez mazani ze zdroje)

on:
  workflow_dispatch:
    inputs:
      batch_limit:
        description: "Kolik dokumentu max. na shard v jedne davce (prakticky bez limitu, hlida se hlavne casem behu)"
        required: false
        default: "100000"
  schedule:
    - cron: "0 9 * * *"

jobs:
  migrate:
    runs-on: [self-hosted, nas]
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: [do1997, 1998_2007, 2008_2020, 2021_dosud]
    concurrency:
      group: migrate-zakony-neon-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - name: Cekat na DNS/sit (NAS runner muze mit vypadek)
        run: |
          for i in $(seq 1 30); do
            getent hosts github.com >/dev/null 2>&1 && echo "DNS OK" && break
            echo "DNS zatim nedostupne, cekam 10s... ($i/30)"
            sleep 10
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run migration (shard ${{ matrix.shard }})
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEON_ZAKONY_DO1997_DB_URL: ${{ secrets.NEON_ZAKONY_DO1997_DB_URL }}
          NEON_ZAKONY_1998_2007_DB_URL: ${{ secrets.NEON_ZAKONY_1998_2007_DB_URL }}
          NEON_ZAKONY_2008_2020_DB_URL: ${{ secrets.NEON_ZAKONY_2008_2020_DB_URL }}
          NEON_ZAKONY_2021_DOSUD_DB_URL: ${{ secrets.NEON_ZAKONY_2021_DOSUD_DB_URL }}
          TARGET_SHARD: ${{ matrix.shard }}
          BATCH_LIMIT: ${{ github.event.inputs.batch_limit || '100000' }}
          TIME_BUDGET_SECONDS: "3000"
        run: python scripts/migrate_zakony_to_neon.py
