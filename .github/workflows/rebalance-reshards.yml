name: Presun dokumentu mezi reshardy (RUCNI SPUSTENI)

# Radek 2026-10-05: vyvazeni zaplneni - presune cast historickych dokumentu z
# jednoho reshardu do druheho (kopie -> kontrola poctu -> smazani, po
# dokumentech). DRY_RUN je vychozi - nejdriv vypise jen plan.

on:
  workflow_dispatch:
    inputs:
      src_shard:
        description: "Zdrojovy shard (napr. reshard-07)"
        default: "reshard-07"
      dst_shard:
        description: "Cilovy shard (napr. reshard-08)"
        default: "reshard-08"
      move_chunks:
        description: "Kolik chunku priblizne presunout"
        default: "12000"
      dry_run:
        description: "true = jen plan, false = skutecny presun"
        default: "true"

concurrency:
  group: rebalance-shards-solo
  cancel-in-progress: false

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Presun
        working-directory: scripts
        env:
          SRC_SHARD: ${{ inputs.src_shard }}
          DST_SHARD: ${{ inputs.dst_shard }}
          MOVE_CHUNKS: ${{ inputs.move_chunks }}
          DRY_RUN: ${{ inputs.dry_run }}
          TIME_BUDGET_SECONDS: "5000"
          NEON_RESHARD_01_DB_URL: ${{ secrets.NEON_RESHARD_01_DB_URL }}
          NEON_RESHARD_02_DB_URL: ${{ secrets.NEON_RESHARD_02_DB_URL }}
          NEON_RESHARD_03_DB_URL: ${{ secrets.NEON_RESHARD_03_DB_URL }}
          NEON_RESHARD_04_DB_URL: ${{ secrets.NEON_RESHARD_04_DB_URL }}
          NEON_RESHARD_05_DB_URL: ${{ secrets.NEON_RESHARD_05_DB_URL }}
          NEON_RESHARD_06_DB_URL: ${{ secrets.NEON_RESHARD_06_DB_URL }}
          NEON_RESHARD_07_DB_URL: ${{ secrets.NEON_RESHARD_07_DB_URL }}
          NEON_RESHARD_08_DB_URL: ${{ secrets.NEON_RESHARD_08_DB_URL }}
          NEON_RESHARD_09_DB_URL: ${{ secrets.NEON_RESHARD_09_DB_URL }}
        run: python rebalance_reshards.py
