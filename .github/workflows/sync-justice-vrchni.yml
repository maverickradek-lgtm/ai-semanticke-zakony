name: Sync judikatura - Vrchni soudy

on:
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Pocet dnu zpet k importu (pro prvni velky beh zadejte vyssi cislo, napr. 365)"
        required: false
        default: "5"
  schedule:
    - cron: "15 5 * * *"

concurrency:
  group: db-heavy-primary
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, nas]
    timeout-minutes: 340
    steps:
      - name: Cekat na DNS/sit (NAS runner muze mit vypadek)
        run: |
          for i in $(seq 1 30); do
            getent hosts github.com >/dev/null 2>&1 && echo "DNS OK" && break
            echo "DNS zatim nedostupne, cekam 10s... ($i/30)"
            sleep 10
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --root-user-action=ignore -r scripts/requirements.txt

      - name: Run judikatura sync (Vrchni soudy)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_UOHS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_UOHS }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '5' }}
        run: python scripts/sync_justice_vrchni.py
