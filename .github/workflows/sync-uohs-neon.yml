name: Sync UOHS (Neon)

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: "Max novych rozhodnuti za beh"
        required: false
        default: "300"
  schedule:
    - cron: "30 4 * * *"

concurrency:
  group: sync-uohs-solo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, nas]
    timeout-minutes: 60
    steps:
      - name: Cekat na DNS/sit (NAS runner muze mit vypadek)
        run: |
          for i in $(seq 1 30); do
            getent hosts github.com >/dev/null 2>&1 && echo "DNS OK" && break
            echo "DNS zatim nedostupne, cekam 10s... ($i/30)"
            sleep 10
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --root-user-action=ignore -r scripts/requirements.txt

      - name: Run UOHS sync (Neon)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEON_UOHS_DB_URL: ${{ secrets.NEON_UOHS_DB_URL }}
          # Znovupouzity jiz existujici Gemini klice (GEMINI_API_KEY_UOHS
          # zamerne vynechan - beha soubezne na GitHub-hosted runneru v
          # sync-esbirka-embed.yml (embed_uohs/embed_judikat), aby se
          # nezdvojnasobila zatez na stejny projekt/kvotu).
          GEMINI_API_KEY_POOL: "${{ secrets.GEMINI_API_KEY_2 }},${{ secrets.GEMINI_API_KEY_NS }}"
          MAX_ITEMS: ${{ inputs.max_items || '300' }}
          TIME_BUDGET_SECONDS: "3000"
        run: python scripts/sync_uohs_neon.py
