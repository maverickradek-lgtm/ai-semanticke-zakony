name: Kontrola zadosti o predpis

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync e-Sbirka - historicka zneni (od 2020)"]
    types: [completed]

concurrency:
  group: db-heavy-primary
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Zkontrolovat cekajici zadosti
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ESBIRKA_REST_API_KEY: ${{ secrets.ESBIRKA_REST_API_KEY }}
        run: python scripts/check_predpis_requests.py
