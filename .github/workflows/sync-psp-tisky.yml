name: Sync psp.cz - duvodove zpravy k zakonum

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: "Kolik novych zakonu USPESNE zpracovat v tomto behu"
        required: false
        default: "15"
      max_attempts:
        description: "Kolik zakonu maximalne proverit celkem (i neuspesnych) - pojistka proti timeoutu"
        required: false
        default: "80"

  schedule:
    - cron: "0 2 * * *"

jobs:
  sync_duvodove_zpravy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch explanatory reports (duvodove zpravy)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_ITEMS: ${{ github.event.inputs.max_items || '15' }}
          MAX_ATTEMPTS: ${{ github.event.inputs.max_attempts || '80' }}
        run: python scripts/sync_psp_tisky.py
