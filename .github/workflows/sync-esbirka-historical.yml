name: Sync e-Sbirka - historicka zneni (od 2020)

on:
  workflow_dispatch:
    inputs:
      max_versions:
        description: "Max. pocet historickych zneni ke zpracovani v tomto behu"
        default: "500"
      cutoff_years:
        description: "Kolik let zpetne importovat historicka zneni"
        default: "5"
  schedule:
    - cron: "30 5 * * *"

jobs:
  import_historical:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Import historical predpis versions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_VERSIONS_PER_RUN: ${{ github.event.inputs.max_versions || '500' }}
          CUTOFF_YEARS: ${{ github.event.inputs.cutoff_years || '5' }}
        run: python scripts/sync_esbirka_historical.py
