name: Presun chunks.content do Supabase Storage

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: "Kolik chunku max. migrovat v tomto behu (200000 = prakticky vse najednou)"
        required: false
        default: "200000"
      batch_size:
        description: "Velikost jedne davky (fetch + finalize RPC)"
        required: false
        default: "200"
      concurrency:
        description: "Kolik soubezych uploadu do Storage"
        required: false
        default: "15"

  schedule:
    - cron: "0 5 * * *"

concurrency:
  group: db-heavy-primary
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Migrate chunk content to Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_ITEMS: ${{ github.event.inputs.max_items || '200000' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '200' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '15' }}
        run: python scripts/migrate_chunks_to_storage.py
