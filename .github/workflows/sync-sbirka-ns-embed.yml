name: Sync Sbirka NS - denni dobihani embeddingu (faze B)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: db-heavy-secondary
  cancel-in-progress: false

jobs:
  embed_sbirka_ns:
    runs-on: [self-hosted, nas]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --root-user-action=ignore -r scripts/requirements.txt

      - name: Run embedding backfill (Sbirka NS + NSS)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_NS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_NS }}
          # 2026-07-21: vlastni vyhrazeny klic (novy, samostatny Google
          # ucet/projekt - viz project_identifiers v pameti). Gemini
          # Embedding free tier limit je oficialne 1000 RPD / 100 RPM
          # PER PROJECT (potvrzeno na ai.google.dev/gemini-api/docs/rate-limits:
          # "Rate limits are applied per project, not per API key") - tedy
          # ne "na cely Google ucet", jak jsme si drive mysleli, ale na
          # konkretni Google Cloud projekt, ktery za danym klicem stoji.
          # Rozpocet 900 necha malou rezervu pod realnym stropem 1000, aby
          # job skoncil cistě pred prvnim 429, ne az po nem.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_NS }}
          DAILY_EMBED_BUDGET: "900"
        run: python scripts/sync_sbirka_ns_embed.py
