name: Sync Sbirka NS - denni dobihani embeddingu (faze B)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 4 * * *"

jobs:
  embed_sbirka_ns:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run embedding backfill (Sbirka NS + NSS)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_NS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_NS }}
          # 2026-07-21: presunuto na vlastni vyhrazeny klic (novy,
          # samostatny Google ucet - viz project_identifiers v pameti).
          # Predtim tento job sdilel GEMINI_API_KEY_UOHS s embed_uohs a
          # musel se spokojit jen se zbytkovou denni kvotou toho uctu
          # (rozpocet drzeny nizko na 300/den, viz historie souboru).
          # S vlastnim uctem uz neni duvod byt konzervativni - NS+NSS
          # dohromady maji jen ~5.6k nezaembedovanych chunku, takze i
          # tento vyssi rozpocet je casem dobehne za pár dni, ne tydnu.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_NS }}
          DAILY_EMBED_BUDGET: "2000"
        run: python scripts/sync_sbirka_ns_embed.py
